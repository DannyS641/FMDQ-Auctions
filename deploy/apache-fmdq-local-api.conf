#
# Local WAMP app host for the FMDQ Auctions project.
#
# Purpose:
# - Keep the default WAMP homepage on http://localhost:80 untouched
# - Serve this app from Apache on http://localhost:8080
# - Mirror the production same-origin layout:
#     /          -> dist/            (built React app)
#     /api/*     -> api/public       (PHP front controller)
#     /uploads/* -> api/public       (access-controlled file routes)
#
# Install by copying this file into C:/wamp64/alias/ and restarting Apache.
#

Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/wamp64/www/FMDQ-Auctions/dist"

    Alias /api "C:/wamp64/www/FMDQ-Auctions/api/public"
    Alias /uploads "C:/wamp64/www/FMDQ-Auctions/api/public"

    <Directory "C:/wamp64/www/FMDQ-Auctions/api/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    <Directory "C:/wamp64/www/FMDQ-Auctions/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
