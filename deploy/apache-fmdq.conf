# =============================================================================
# FMDQ Auctions — Apache virtual host (production, same-origin)
#
# Serves the React build (dist/) and the PHP API (api/public/) on ONE HTTPS
# origin, so the browser makes same-origin requests (no CORS). The session
# cookie is httpOnly + Secure + SameSite, which also defends against CSRF.
#
# Requires modules: mod_rewrite, mod_headers, mod_ssl, and PHP (mod_php or
# php-fpm). On WAMP these are toggled in the tray menu / httpd.conf.
#
# Paths below assume a Windows WAMP install at C:/wamp64/www/fmdq — adjust to
# your layout. (Linux example: /var/www/fmdq.  macOS/MAMP: see docs/DEPLOYMENT.md.)
# =============================================================================

# --- Redirect all HTTP to HTTPS ---------------------------------------------
<VirtualHost *:80>
    ServerName auctions.fmdqgroup.com
    Redirect permanent / https://auctions.fmdqgroup.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName auctions.fmdqgroup.com

    # The React production build is the document root.
    DocumentRoot "C:/wamp64/www/fmdq/dist"

    # --- TLS -----------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile    "C:/wamp64/certs/fmdq-fullchain.crt"
    SSLCertificateKeyFile "C:/wamp64/certs/fmdq.key"
    # SSLCertificateChainFile "C:/wamp64/certs/fmdq-chain.crt"   # if required
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # --- PHP API + access-controlled file serving ----------------------------
    # /api/* and /uploads/* are handled by the PHP front controller. Aliasing
    # them to api/public takes precedence over the dist DocumentRoot.
    Alias /api     "C:/wamp64/www/fmdq/api/public"
    Alias /uploads "C:/wamp64/www/fmdq/api/public"

    <Directory "C:/wamp64/www/fmdq/api/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        # Route every /api/* and /uploads/* request to the front controller.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # --- React SPA (static assets + client-side routing) ---------------------
    <Directory "C:/wamp64/www/fmdq/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        # Serve real files (JS/CSS/images) directly; otherwise hand the URL to
        # the SPA entry point so React Router can resolve it.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # --- Security headers (the API also sets its own per-response) ------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Vite content-hashes asset filenames, so they can cache forever.
    <FilesMatch "\.(js|css|woff2?|png|jpe?g|webp|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    # Never cache the SPA shell (so deploys are picked up immediately).
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog  "C:/wamp64/logs/fmdq-error.log"
    CustomLog "C:/wamp64/logs/fmdq-access.log" combined
</VirtualHost>
